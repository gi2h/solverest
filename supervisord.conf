; ═══════════════════════════════════════════════════════════════════════
; Fortress Captcha - supervisord configuration
; Runs flaresolverr (background) + api-gateway (foreground)
; ═══════════════════════════════════════════════════════════════════════
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── PROCESS 1: FlareSolverr ────────────────────────────────────────────
; Listens on 127.0.0.1:8191 (internal only)
; Boot time: 10-20 detik (Chromium warmup)
[program:flaresolverr]
command=python3 flaresolverr.py
directory=/app
environment=PORT="8191",HOST="127.0.0.1",LOG_LEVEL="info",LOG_HTML="false",CAPTCHA_SOLVER="none",TZ="UTC"
autorestart=true
startsecs=10
startretries=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=false
stopasgroup=true
killasgroup=true

; ── PROCESS 2: API Gateway (uvicorn) ───────────────────────────────────
; Listens on 0.0.0.0:$PORT (public via Railway)
[program:api-gateway]
command=/solver/start.sh
directory=/solver
environment=PYTHONPATH="/solver",FLARESOLVERR_URL="http://127.0.0.1:8191",FLARESOLVERR_ENABLED="1"
autorestart=true
startsecs=5
startretries=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=false
stopasgroup=true
killasgroup=true
